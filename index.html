<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ECORoute — réservation de capacité camion</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0b7a5e" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="toast-wrap" id="toastWrap"></div>
<header>
  <div class="row">
    <div class="brand"><img src="icons/icon-192.png" alt="" style="width:26px;height:26px;border-radius:7px;vertical-align:-7px;margin-right:2px;" /> ECORoute<span class="tagline">réservation de capacité camion</span></div>
    <div style="display:flex; align-items:center; gap:8px;">
      <div class="idbox" id="idbox" style="display:none;"><span class="dot"></span><span id="idboxText">—</span></div>
      <button class="logout-btn" id="logoutBtn" style="display:none;" onclick="doLogout()">Déconnexion</button>
      <select id="langSelect" class="lang-select" onchange="setLang(this.value)">
        <option value="fr">FR</option>
        <option value="en">EN</option>
        <option value="ar">AR</option>
      </select>
      <button class="theme-btn" id="themeBtn" onclick="toggleTheme()" title="Mode sombre">🌙</button>
    </div>
  </div>
</header>
<main id="app"></main>
<div id="chatOverlay"></div>
<script src="config.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
