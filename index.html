<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wassil — réservation de capacité camion</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0b1120" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="icon" href="icon-192.png" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root {
    --bg: #f3f2ef; --card: #fff; --border: #ebe9e6; --text: #1c1917; --muted: #78716c;
    --header1: #0b1120; --header2: #16213a; --amber: #f59e0b; --field: #fdfcfb; --fieldborder: #ded9d4;
  }
  [data-theme="dark"] {
    --bg: #14120f; --card: #1f1c18; --border: #322e28; --text: #f2f0ec; --muted: #a39c93;
    --header1: #05070d; --header2: #0e1524; --field: #26221d; --fieldborder: #3a352d;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); transition: background .2s, color .2s; }
  a { color: inherit; }
  header { background: var(--header1); color: #f1f5f9; padding: 16px 18px 14px; position: sticky; top: 0; z-index: 40; }
  header .row { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; max-width: 780px; margin: 0 auto; }
  header .brand { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 18px; letter-spacing: -0.2px; }
  header .brand .tagline { font-weight: 400; font-size: 11.5px; color: #94a3b8; display: block; margin-top: 1px; }
  .idbox { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: #cbd5e1; background: rgba(255,255,255,.06); padding: 5px 10px; border-radius: 20px; }
  .idbox .dot { width: 7px; height: 7px; border-radius: 50%; background: #34d399; }
  .theme-btn, .logout-btn { background: rgba(255,255,255,.08); border: none; color: #f1f5f9; height: 30px; border-radius: 15px; cursor: pointer; font-size: 13px; padding: 0 10px; }
  .theme-btn { width: 30px; padding: 0; }

  main { max-width: 780px; margin: 0 auto; padding: 16px; }
  .authwrap { max-width: 380px; margin: 40px auto; padding: 0 16px; }
  .notice { background: #fffbeb; border: 1px solid #fde68a; color: #92400e; padding: 9px 13px; border-radius: 10px; font-size: 13px; margin-bottom: 14px; }
  [data-theme="dark"] .notice { background: #3a2f10; border-color: #5c4a14; color: #fbbf24; }
  h2 { font-size: 14.5px; font-weight: 700; margin: 20px 0 10px; color: var(--text); text-transform: uppercase; letter-spacing: .4px; }
  .toprow { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .btn { border: none; cursor: pointer; padding: 8px 15px; border-radius: 9px; font-size: 14px; transition: transform .08s ease; }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: .55; cursor: default; }
  .btn-dark { background: #0f172a; color: #f1f5f9; }
  .btn-amber { background: var(--header1); color: #fff; font-weight: 600; width: 100%; }
  .btn-outline { background: var(--card); border: 1px solid var(--fieldborder); color: var(--muted); font-size: 12px; padding: 5px 11px; cursor: pointer; border-radius: 7px; }
  .btn-ok { background: #d1fae5; color: #065f46; font-size: 12px; padding: 5px 11px; border: none; border-radius: 7px; cursor: pointer; font-weight: 600; }
  .btn-no { background: #fee2e2; color: #991b1b; font-size: 12px; padding: 5px 11px; border: none; border-radius: 7px; cursor: pointer; font-weight: 600; }
  .btn-info { background: #dbeafe; color: #1e40af; font-size: 12px; padding: 5px 11px; border: none; border-radius: 7px; cursor: pointer; font-weight: 600; }
  .btn-purple { background: #ede9fe; color: #5b21b6; font-size: 12px; padding: 5px 11px; border: none; border-radius: 7px; cursor: pointer; font-weight: 600; }

  .subtabs { display: flex; gap: 6px; margin-bottom: 14px; background: var(--border); padding: 4px; border-radius: 10px; }
  .subtabs button { flex: 1; border: none; background: transparent; padding: 8px 6px; border-radius: 7px; font-size: 12.5px; font-weight: 600; color: var(--muted); cursor: pointer; }
  .subtabs button.active { background: var(--header1); color: #fff; }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 15px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.03); animation: fadein .25s ease; }
  @keyframes fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  .field { border: 1px solid var(--fieldborder); border-radius: 8px; padding: 8px 11px; font-size: 14px; width: 100%; margin-bottom: 8px; background: var(--field); color: var(--text); }
  .field:focus { outline: 2px solid #f59e0b33; border-color: #f59e0b; }
  select.field { -webkit-appearance:none; appearance:none; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .muted { color: var(--muted); font-size: 12px; }
  .error { color: #dc2626; font-size: 12px; margin-top: 6px; }
  .badge { font-size: 10.5px; font-weight: 700; padding: 3px 9px; border-radius: 20px; text-transform: uppercase; letter-spacing: .3px; }
  .badge-wait { background: #fef3c7; color: #92400e; }
  .badge-ok { background: #d1fae5; color: #065f46; }
  .badge-no { background: #fee2e2; color: #991b1b; }
  .badge-done { background: #dbeafe; color: #1e40af; }
  .badge-cancel { background: #e7e5e4; color: #57534e; }
  .badge-route { background: #ede9fe; color: #5b21b6; }
  .verified { color: #059669; font-size: 11px; font-weight: 700; }
  .reslist { border-top: 1px dashed var(--border); margin-top: 11px; padding-top: 11px; }
  .resitem { background: var(--bg); border-radius: 10px; padding: 11px; margin-bottom: 8px; }
  .flexwrap { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  .msg { font-size: 12px; margin-bottom: 3px; }
  .chatbox { border-top: 1px solid var(--border); margin-top: 8px; padding-top: 8px; }
  .chatinput { display: flex; gap: 6px; }
  .chatinput input { flex: 1; border: 1px solid var(--fieldborder); border-radius: 7px; padding: 6px 9px; font-size: 12px; background: var(--field); color: var(--text); }
  .chatinput button { background: #0f172a; color: #fff; border: none; border-radius: 7px; padding: 6px 11px; font-size: 12px; cursor: pointer; }
  .footer-note { font-size: 11px; color: var(--muted); margin-top: 26px; line-height: 1.5; text-align: center; }
  .profilebar { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 13px 15px; margin-bottom: 14px; }
  .profilebar .summary { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; font-size: 13px; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; background: #0f172a; color: #f59e0b; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; margin-right: 9px; }
  .avatar-sm { width: 20px; height: 20px; border-radius: 50%; background: #0f172a; color: #f59e0b; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 9px; flex-shrink: 0; }
  .trip-row { cursor: pointer; }
  .trip-row-line1 { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .trip-row-route { font-size: 15px; font-weight: 700; }
  .trip-row-price { font-size: 15px; font-weight: 700; color: #b45309; white-space: nowrap; }
  [data-theme="dark"] .trip-row-price { color: #fbbf24; }
  .trip-row-line2 { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; gap: 8px; }
  .trip-row-line2-left { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); min-width: 0; }
  .trip-row-line2-left span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .trip-details { border-top: 1px dashed var(--border); margin-top: 9px; padding-top: 9px; font-size: 12.5px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
  .stat { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px; text-align: center; }
  .stat .num { font-size: 18px; font-weight: 800; color: var(--text); }
  .stat .lbl { font-size: 10.5px; color: var(--muted); margin-top: 2px; text-transform: uppercase; letter-spacing: .3px; }
  .stars { font-size: 17px; color: #f59e0b; cursor: pointer; letter-spacing: 2px; }
  .contact { background: #eff6ff; border: 1px solid #bfdbfe; color: #1e40af; border-radius: 8px; padding: 7px 11px; font-size: 12px; margin-top: 8px; }
  [data-theme="dark"] .contact { background: #16233d; border-color: #1e3a5f; color: #93c5fd; }
  .route-badge { display: inline-flex; align-items: center; gap: 5px; background: var(--bg); border-radius: 20px; padding: 3px 10px; font-size: 11.5px; color: var(--muted); margin-top: 5px; }
  .route-link { font-size: 11.5px; color: #2563eb; text-decoration: none; font-weight: 600; margin-left: 6px; }
  .co2 { background: #ecfdf5; border: 1px solid #a7f3d0; color: #047857; border-radius: 8px; padding: 6px 10px; font-size: 11.5px; margin-top: 8px; }
  [data-theme="dark"] .co2 { background: #082f24; border-color: #115e42; color: #6ee7b7; }
  .tier { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 20px; background: #fef3c7; color: #92400e; margin-left: 6px; }

  .addr-wrap { position: relative; margin-bottom: 8px; }
  .addr-wrap .field { margin-bottom: 0; }
  .addr-row { display: flex; gap: 6px; align-items: center; }
  .geo-btn { background: #0f172a; color: #f59e0b; border: none; border-radius: 8px; width: 38px; height: 36px; flex-shrink: 0; cursor: pointer; font-size: 15px; }
  .suggestions { position: absolute; z-index: 9999; background: var(--card); border: 1px solid var(--fieldborder); border-radius: 8px; margin-top: 3px; left: 0; right: 0; max-height: 170px; overflow-y: auto; box-shadow: 0 6px 16px rgba(0,0,0,.12); }
  .suggestion-item { padding: 8px 11px; font-size: 12.5px; cursor: pointer; border-bottom: 1px solid var(--border); }
  .suggestion-item:hover { background: var(--bg); }
  #route-map { height: 170px; border-radius: 10px; margin: 4px 0 10px; border: 1px solid var(--fieldborder); }
  #route-info { font-size: 12.5px; color: var(--text); margin-bottom: 8px; }

  .progress-outer { background: var(--border); border-radius: 20px; height: 8px; overflow: hidden; margin: 8px 0 4px; }
  .progress-inner { background: linear-gradient(90deg, #f59e0b, #fbbf24); height: 100%; width: 0%; transition: width 1s linear; }
  .eta-text { font-size: 12px; color: var(--muted); }

  nav.bottomnav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid var(--border); display: flex; z-index: 50; box-shadow: 0 -2px 10px rgba(0,0,0,.05); }
  nav.bottomnav button { flex: 1; border: none; background: none; padding: 10px 0 8px; font-size: 12.5px; color: var(--muted); cursor: pointer; position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  nav.bottomnav button .ic { font-size: 19px; }
  nav.bottomnav button.active { color: var(--text); font-weight: 700; }
  nav.bottomnav .dot { position: absolute; top: 5px; right: calc(50% - 20px); background: #dc2626; color: #fff; font-size: 9.5px; font-weight: 700; border-radius: 8px; min-width: 15px; height: 15px; display: flex; align-items: center; justify-content: center; padding: 0 3px; }

  .toast-wrap { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 100; display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .toast { background: #1c1917; color: #fff; font-size: 13px; padding: 9px 16px; border-radius: 10px; box-shadow: 0 4px 14px rgba(0,0,0,.25); animation: toastin .2s ease; max-width: 90vw; }
  .toast.err { background: #991b1b; }
  .toast.ok { background: #065f46; }
  @keyframes toastin { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }

  .authcard { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 22px; box-shadow: 0 4px 16px rgba(0,0,0,.06); }
  .authtabs { display: flex; gap: 6px; margin-bottom: 16px; background: var(--border); padding: 4px; border-radius: 10px; }
  .authtabs button { flex: 1; border: none; background: transparent; padding: 8px; border-radius: 7px; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; }
  .authtabs button.active { background: var(--card); color: var(--text); }
  .spinner { display: inline-block; width: 13px; height: 13px; border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: middle; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .pwd-wrap { position: relative; }
  .pwd-wrap input { padding-right: 38px; }
  .pwd-toggle { position: absolute; right: 4px; top: 4px; background: none; border: none; cursor: pointer; font-size: 15px; padding: 6px; }
  .pager { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 16px; }
  .pager button { width: 34px; height: 34px; padding: 0; border-radius: 8px; border: 1px solid var(--fieldborder); background: var(--card); cursor: pointer; font-size: 15px; }
  .pager button:disabled { opacity: .35; cursor: default; }
</style>
</head>
<body>
<div class="toast-wrap" id="toastWrap"></div>
<header>
  <div class="row">
    <div class="brand">🚚 Wassil<span class="tagline">réservation de capacité camion</span></div>
    <div style="display:flex; align-items:center; gap:8px;">
      <div class="idbox" id="idbox" style="display:none;"><span class="dot"></span><span id="idboxText">—</span></div>
      <button class="logout-btn" id="logoutBtn" style="display:none;" onclick="doLogout()">Déconnexion</button>
      <button class="theme-btn" id="themeBtn" onclick="toggleTheme()" title="Mode sombre">🌙</button>
    </div>
  </div>
</header>
<main id="app"></main>

<script>
// ================= config Supabase =================
var SUPABASE_URL = "https://vktuwoyikseadvfzgacd.supabase.co";
var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZrdHV3b3lpa3NlYWR2ZnpnYWNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3Mzk5ODQsImV4cCI6MjEwNTMxNTk4NH0.etKO1Ruho3Uj80RpS8v4M0TAlQW9WJY39z55j6_pPUs";
var sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

var VEHICLES = { bache: "🚚 Bâché", frigo: "❄️ Frigorifique", plateau: "📐 Plateau", benne: "🏗️ Benne" };
function vehicleLabel(v) { return VEHICLES[v] || "🚚 Bâché"; }
function uid() { return Math.random().toString(36).slice(2, 10); }
function esc(s) { var d = document.createElement("div"); d.textContent = s == null ? "" : s; return d.innerHTML; }

// ================= état =================
var state = {
  session: null, myProfile: null, myDriverProfile: null, profilesById: {},
  trips: [], reservations: [], requests: [], offers: [],
  clientSubTab: "browse", chauffeurSubTab: "mytrips",
  authMode: "login", authError: "", authBusy: false,
  editingProfile: false, profileError: "", _chosenRole: null,
  search: "", sortBy: "date", tripsPage: 1, tripsPageSize: 10,
  showNewTrip: false, showNewRequest: false,
  reserveFor: null, expandedTrip: null, openThread: null, openReqThread: null,
  messages: {},
  tripError: "", reserveError: "", reqError: ""
};

function myId() { return state.session ? state.session.user.id : null; }
function profileById(id) { return state.profilesById[id] || null; }
function displayName(p) { return p ? (p.prenom + " " + p.nom) : "—"; }
function profileInitials(p) { if (!p) return "?"; return (((p.prenom||"")[0]||"") + ((p.nom||"")[0]||"")).toUpperCase(); }
function verifiedTag(p) { return p && p.verified ? '<span class="verified">✅ Vérifié</span>' : ""; }

// ================= thème =================
function togglePwd(fieldId, btn) {
  var el = document.getElementById(fieldId);
  if (el.type === "password") { el.type = "text"; btn.textContent = "🙈"; }
  else { el.type = "password"; btn.textContent = "👁️"; }
}
function toggleTheme() {
  var el = document.documentElement; var dark = el.getAttribute("data-theme") === "dark";
  el.setAttribute("data-theme", dark ? "light" : "dark");
  document.getElementById("themeBtn").textContent = dark ? "🌙" : "☀️";
}

// ================= toasts =================
function showToast(msg, type) {
  var wrap = document.getElementById("toastWrap");
  var t = document.createElement("div"); t.className = "toast" + (type ? " " + type : ""); t.textContent = msg;
  wrap.appendChild(t);
  setTimeout(function () { t.style.opacity = "0"; t.style.transition = "opacity .3s"; setTimeout(function () { t.remove(); }, 300); }, 2600);
}

// ================= géoloc & autocomplétion (OSM/Nominatim) =================
var addressDebounce = {}, lastSuggestions = {}, coords = { origin: null, dest: null };
function onAddressInput(fieldId) {
  var val = document.getElementById(fieldId).value;
  clearTimeout(addressDebounce[fieldId]);
  if (val.trim().length < 3) { document.getElementById("sugg-" + fieldId).innerHTML = ""; return; }
  addressDebounce[fieldId] = setTimeout(function () { searchAddress(fieldId, val); }, 350);
}
function searchAddress(fieldId, query) {
  var url = "https://nominatim.openstreetmap.org/search?format=json&limit=5&countrycodes=dz&q=" + encodeURIComponent(query);
  fetch(url, { headers: { "Accept-Language": "fr" } }).then(function (r) { return r.json(); })
    .then(function (results) { renderSuggestions(fieldId, results); })
    .catch(function () { document.getElementById("sugg-" + fieldId).innerHTML = '<div class="suggestion-item muted">Suggestions indisponibles</div>'; });
}
function renderSuggestions(fieldId, results) {
  var box = document.getElementById("sugg-" + fieldId); if (!box) return;
  if (!results || !results.length) { box.innerHTML = ""; return; }
  lastSuggestions[fieldId] = results;
  box.innerHTML = results.map(function (r, i) { return '<div class="suggestion-item" onmousedown="selectAddress(\'' + fieldId + '\',' + i + ')">' + esc(r.display_name) + '</div>'; }).join("");
}
function selectAddress(fieldId, idx) {
  var r = lastSuggestions[fieldId][idx];
  document.getElementById(fieldId).value = r.display_name;
  document.getElementById("sugg-" + fieldId).innerHTML = "";
  var key = (fieldId === "f-origin" || fieldId === "r-origin") ? "origin" : "dest";
  coords[key] = { lat: parseFloat(r.lat), lon: parseFloat(r.lon) };
  updateRoutePreview();
}
function hideSuggestionsLater(fieldId) { setTimeout(function () { var box = document.getElementById("sugg-" + fieldId); if (box) box.innerHTML = ""; }, 200); }
function useMyLocation(fieldId, btn) {
  if (!navigator.geolocation) { showToast("Géolocalisation non supportée.", "err"); return; }
  btn.textContent = "…";
  navigator.geolocation.getCurrentPosition(function (pos) {
    var lat = pos.coords.latitude, lon = pos.coords.longitude;
    fetch("https://nominatim.openstreetmap.org/reverse?format=json&lat=" + lat + "&lon=" + lon, { headers: { "Accept-Language": "fr" } })
      .then(function (r) { return r.json(); })
      .then(function (data) { document.getElementById(fieldId).value = data.display_name || (lat.toFixed(5) + ", " + lon.toFixed(5)); coords.origin = { lat: lat, lon: lon }; btn.textContent = "📍"; updateRoutePreview(); })
      .catch(function () { document.getElementById(fieldId).value = lat.toFixed(5) + ", " + lon.toFixed(5); coords.origin = { lat: lat, lon: lon }; btn.textContent = "📍"; updateRoutePreview(); });
  }, function (err) { showToast("Position indisponible : " + err.message, "err"); btn.textContent = "📍"; });
}

// ================= carte + itinéraire =================
var routeMap = null, routeLayer = null, routeInfo = null;
function ensureMap() {
  var el = document.getElementById("route-map"); if (!el) return null;
  if (routeMap) { routeMap.remove(); routeMap = null; }
  routeMap = L.map(el, { zoomControl: false, attributionControl: false }).setView([28.0, 2.5], 4.2);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 18 }).addTo(routeMap);
  routeLayer = L.layerGroup().addTo(routeMap);
  return routeMap;
}
function updateRoutePreview() {
  var el = document.getElementById("route-map"); if (!el) return;
  if (!routeMap) ensureMap();
  routeLayer.clearLayers();
  var pts = [];
  if (coords.origin) { L.marker([coords.origin.lat, coords.origin.lon]).addTo(routeLayer); pts.push([coords.origin.lat, coords.origin.lon]); }
  if (coords.dest) { L.marker([coords.dest.lat, coords.dest.lon]).addTo(routeLayer); pts.push([coords.dest.lat, coords.dest.lon]); }
  if (pts.length === 2) { L.polyline(pts, { color: "#f59e0b", weight: 4, opacity: .85 }).addTo(routeLayer); routeMap.fitBounds(pts, { padding: [24, 24] }); fetchRouteInfo(); }
  else if (pts.length === 1) { routeMap.setView(pts[0], 11); var infoEl = document.getElementById("route-info"); if (infoEl) infoEl.textContent = ""; routeInfo = null; }
}
function fetchRouteInfo() {
  var infoEl = document.getElementById("route-info"); if (infoEl) infoEl.textContent = "Calcul de l'itinéraire…";
  var url = "https://router.project-osrm.org/route/v1/driving/" + coords.origin.lon + "," + coords.origin.lat + ";" + coords.dest.lon + "," + coords.dest.lat + "?overview=false";
  fetch(url).then(function (r) { return r.json(); }).then(function (data) {
    if (data.routes && data.routes[0]) {
      var km = data.routes[0].distance / 1000, min = data.routes[0].duration / 60;

async function loadAllData() {

function subscribeRealtime() {

    .on("postgres_changes", { event: "*", schema: "public", table: "trips" }, handleDataChange)
    .on("postgres_changes", { event: "*", schema: "public", table: "reservations" }, handleDataChange)
    .on("postgres_changes", { event: "*", schema: "public", table: "requests" }, handleDataChange)
    .on("postgres_changes", { event: "*", schema: "public", table: "request_offers" }, handleDataChange)

// ================= messages (chat) =================
function threadKey(type, id) { return type + ":" + id; }
async function loadThreadMessages(type, id) {
  var { data } = await sb.from("messages").select("*").eq("thread_type", type).eq("thread_id", id).order("created_at");
  state.messages[threadKey(type, id)] = data || [];

function subscribeThread(type, id) {
  if (threadChannel) { sb.removeChannel(threadChannel); threadChannel = null; }
  threadChannel = sb.channel("thread-" + type + "-" + id)
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "messages", filter: "thread_id=eq." + id }, function (payload) {
      if (payload.new.thread_type !== type) return;
      var key = threadKey(type, id);
      var arr = state.messages[key] || [];
      if (!arr.find(function (m) { return m.id === payload.new.id; })) arr = arr.concat([payload.new]);
      state.messages[key] = arr; render();
    }).subscribe();
}
async function toggleThread(resId) {
  if (state.openThread === resId) { state.openThread = null; if (threadChannel) { sb.removeChannel(threadChannel); threadChannel = null; } render(); return; }
  state.openThread = resId; state.openReqThread = null;
  render();
  await loadThreadMessages("reservation", resId);
  subscribeThread("reservation", resId);
  render();
}
async function toggleReqThread(offerId) {
  if (state.openReqThread === offerId) { state.openReqThread = null; if (threadChannel) { sb.removeChannel(threadChannel); threadChannel = null; } render(); return; }

  var pct = Math.min(100, (elapsedMin / r.eta_minutes) * 100);

  return { pct: pct, remainMin: remainMin };
}

}

// ================= actions =================
function toggleNewTrip() {
  state.showNewTrip = !state.showNewTrip; state.tripError = ""; coords = { origin: null, dest: null }; routeInfo = null; render();
}
function toggleReserve(id) { state.reserveFor = state.reserveFor === id ? null : id; state.reserveError = ""; render(); }
function toggleTripExpand(id) { state.expandedTrip = state.expandedTrip === id ? null : id; if (state.expandedTrip !== id) { state.reserveFor = null; } render(); }
function toggleNewRequest() { state.showNewRequest = !state.showNewRequest; state.reqError = ""; coords = { origin: null, dest: null }; routeInfo = null; render(); }

async function publishTrip() {
  state._origin = document.getElementById("f-origin").value;
  state._dest = document.getElementById("f-dest").value;
  state._date = document.getElementById("f-date").value;
  state._cap = document.getElementById("f-cap").value;
  state._price = document.getElementById("f-price").value;
  state._vehicle = document.getElementById("f-vehicle").value;
  if (!state._origin || !state._dest || !state._date || !state._cap) { state.tripError = "Départ, arrivée, date et capacité sont obligatoires."; render(); return; }
  var row = {
    driver_id: myId(), origin: state._origin.trim(), destination: state._dest.trim(), date: state._date, vehicle_type: state._vehicle,
    capacity: Number(state._cap), remaining: Number(state._cap), price: state._price ? Number(state._price) : null,
    origin_lat: coords.origin ? coords.origin.lat : null, origin_lon: coords.origin ? coords.origin.lon : null,
    dest_lat: coords.dest ? coords.dest.lat : null, dest_lon: coords.dest ? coords.dest.lon : null,
    distance_km: routeInfo ? routeInfo.distanceKm : null, duration_min: routeInfo ? routeInfo.durationMin : null
  };
  var { error } = await sb.from("trips").insert(row);
  if (error) { state.tripError = error.message; render(); return; }
  state.showNewTrip = false; state.tripError = "";
  state._origin = state._dest = state._date = state._cap = state._price = "";
  coords = { origin: null, dest: null }; routeInfo = null;
  await loadAllData(); render(); showToast("Trajet publié 🚚", "ok");
}

async function submitReservation(tripId) {
  var t = tripOf(tripId);
  state._reserveM3 = document.getElementById("f-m3").value;
  if (!state._reserveM3 || Number(state._reserveM3) <= 0) { state.reserveError = "Indiquez un nombre de m³ valide."; render(); return; }
  if (Number(state._reserveM3) > t.remaining) { state.reserveError = "Seulement " + t.remaining + " m³ disponibles sur ce trajet."; render(); return; }
  var { error } = await sb.from("reservations").insert({ trip_id: tripId, client_id: myId(), m3: Number(state._reserveM3), status: "en_attente" });
  if (error) { state.reserveError = error.message; render(); return; }
  state.reserveFor = null; state.reserveError = ""; state._reserveM3 = "";
  await loadAllData(); render(); showToast("Demande envoyée", "ok");
}

async function decide(resId, status) {
  var r = state.reservations.find(function (x) { return x.id === resId; });
  var wasValidated = r.status === "validee" || r.status === "en_route" || r.status === "terminee";
  var { error } = await sb.from("reservations").update({ status: status }).eq("id", resId);
  if (error) { showToast(error.message, "err"); return; }
  if (status === "validee" && !wasValidated) {
    var t = tripOf(r.trip_id);
    await sb.from("trips").update({ remaining: Math.max(0, t.remaining - r.m3) }).eq("id", t.id);
  }
  await loadAllData(); render();
  var labels = { validee: "Réservation validée ✅", refusee: "Réservation refusée", terminee: "Livraison marquée 📦", annulee: "Réservation annulée" };
  showToast(labels[status] || "Mis à jour");
}
async function rateReservation(resId, stars) {
  var { error } = await sb.from("reservations").update({ rating: stars }).eq("id", resId);
  if (error) { showToast(error.message, "err"); return; }
  await loadAllData(); render(); showToast("Merci pour votre avis ⭐");
}

async function publishRequest() {
  state._rOrigin = document.getElementById("r-origin").value;
  state._rDest = document.getElementById("r-dest").value;
  state._rDate = document.getElementById("r-date").value;
  state._rM3 = document.getElementById("r-m3").value;
  state._rNote = document.getElementById("r-note").value;
  if (!state._rOrigin || !state._rDest || !state._rDate || !state._rM3) { state.reqError = "Départ, arrivée, date et m³ sont obligatoires."; render(); return; }
  var row = {
    client_id: myId(), origin: state._rOrigin.trim(), destination: state._rDest.trim(), date: state._rDate, m3_needed: Number(state._rM3), note: state._rNote.trim(),
    origin_lat: coords.origin ? coords.origin.lat : null, origin_lon: coords.origin ? coords.origin.lon : null,
    dest_lat: coords.dest ? coords.dest.lat : null, dest_lon: coords.dest ? coords.dest.lon : null,
    distance_km: routeInfo ? routeInfo.distanceKm : null, duration_min: routeInfo ? routeInfo.durationMin : null, status: "ouverte"
  };
  var { error } = await sb.from("requests").insert(row);
  if (error) { state.reqError = error.message; render(); return; }
  state.showNewRequest = false; state.reqError = "";
  state._rOrigin = state._rDest = state._rDate = state._rM3 = state._rNote = "";
  coords = { origin: null, dest: null }; routeInfo = null;
  await loadAllData(); render(); showToast("Demande publiée 📢", "ok");
}
async function offerOnRequest(reqId) {
  var vehSel = document.getElementById("veh-" + reqId);
  var vehicle = vehSel ? vehSel.value : "bache";
  var { error } = await sb.from("request_offers").insert({ request_id: reqId, driver_id: myId(), vehicle_type: vehicle, status: "proposee" });
  if (error) { showToast(error.message, "err"); return; }
  await loadAllData(); render(); showToast("Proposition envoyée");
}
async function acceptOffer(reqId, offerId) {
  var offersForReq = state.offers.filter(function (o) { return o.request_id === reqId; });
  await Promise.all(offersForReq.map(function (o) {
    var newStatus = (o.id === offerId) ? "acceptee" : (o.status === "proposee" ? "refusee" : o.status);
    return sb.from("request_offers").update({ status: newStatus }).eq("id", o.id);
  }));
  await sb.from("requests").update({ status: "prise_en_charge" }).eq("id", reqId);
  await loadAllData(); render(); showToast("Chauffeur accepté ✅", "ok");
}

if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
}
initAuth();
</script>
